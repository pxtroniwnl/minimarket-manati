# Desarrollo local: app en modo simulador + Postgres. `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manati
      POSTGRES_PASSWORD: manati
      POSTGRES_DB: manati
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manati"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://manati:manati@db:5432/manati
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
